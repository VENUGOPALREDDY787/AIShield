name: aishield-dev

services:
  # ---------------------------------------------------------------------------
  # MongoDB Development Instance
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: aishield-dev-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-aishield_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-devpassword123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-aishield}
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Development Instance
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: aishield-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # API with Live Hot Reloading (tsx watch)
  # ---------------------------------------------------------------------------
  api:
    image: node:20-alpine
    container_name: aishield-dev-api
    working_dir: /app
    command: sh -c "npm ci && npm run build:shared && npm run dev --workspace @aishield/api"
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      SERVICE_NAME: aishield-api
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_KEY: ${API_KEY:-dev-api-key-123456789012345678901234}
      SKIP_AUTH: ${SKIP_AUTH:-true}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://localhost:3000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-aishield_admin}:${MONGO_ROOT_PASSWORD:-devpassword123}@mongo:27017/${MONGO_DATABASE:-aishield}?authSource=admin
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: aishield
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Worker with Live Hot Reloading (tsx watch)
  # ---------------------------------------------------------------------------
  worker:
    image: node:20-alpine
    container_name: aishield-dev-worker
    working_dir: /app
    command: sh -c "apk add --no-cache git docker-cli && npm ci && npm run build:shared && npm run dev --workspace @aishield/worker"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      SERVICE_NAME: aishield-worker
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-aishield_admin}:${MONGO_ROOT_PASSWORD:-devpassword123}@mongo:27017/${MONGO_DATABASE:-aishield}?authSource=admin
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: aishield
      QUEUE_CONCURRENCY: 2
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DASHBOARD_URL: http://localhost:5173
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/worker/node_modules
      - /app/packages/shared/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend Dashboard with Vite HMR
  # ---------------------------------------------------------------------------
  web:
    image: node:20-alpine
    container_name: aishield-dev-web
    working_dir: /app
    command: sh -c "npm ci && npm run build:shared && npm run dev --workspace @aishield/web -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - api

volumes:
  mongo_dev_data:
    name: aishield_dev_mongo_data
  redis_dev_data:
    name: aishield_dev_redis_data
