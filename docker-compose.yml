name: aishield

services:
  # ---------------------------------------------------------------------------
  # 1. Core Data Layer: MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: aishield-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-aishield_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-aishield}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # 2. Core Queue & Cache Layer: Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: aishield-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-devpassword123}"]
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # 3. Application API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aishield-api
    restart: unless-stopped
    init: true
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: aishield-api
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_KEY: ${API_KEY:-}
      SKIP_AUTH: ${SKIP_AUTH:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-aishield_admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-aishield}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword123}@redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-aishield}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    stop_grace_period: 20s

  # ---------------------------------------------------------------------------
  # 4. Background Scan & Debt Scoring Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: aishield-worker
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: aishield-worker
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-aishield_admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-aishield}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword123}@redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-aishield}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-4}
      SCANNER_TIMEOUT_MS: ${SCANNER_TIMEOUT_MS:-120000}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
    volumes:
      - worker_workdir:/tmp/aishield-scans
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - data-net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3072M
        reservations:
          cpus: '1.0'
          memory: 512M
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # 5. Frontend React Dashboard (Nginx SPA)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aishield-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    stop_grace_period: 10s

# -----------------------------------------------------------------------------
# Isolated Networks
# -----------------------------------------------------------------------------
networks:
  # Public-facing: Web reverse proxy -> API
  frontend-net:
    driver: bridge
  # Internal: API -> Worker communication
  backend-net:
    driver: bridge
  # Secure backend: API & Worker -> MongoDB & Redis only (No direct web access)
  data-net:
    driver: bridge

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  mongo_data:
    name: aishield_mongo_data
  mongo_config:
    name: aishield_mongo_config
  redis_data:
    name: aishield_redis_data
  worker_workdir:
    name: aishield_worker_workdir
